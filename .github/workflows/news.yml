name: Market News Monitor

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-monitor:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install feedparser requests

      - name: Run news_monitor.py
        run: python news_monitor.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ vars.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          USE_AI: ${{ vars.USE_AI }}          # env variables use vars.*
          OPENAI_API_KEY: ${{ vars.OPENAI_API_KEY }}
      - name: Cache last batch
        uses: actions/cache@v4
        with:
          path: last_batch.json
          key: last-batch


      - name: Commit seen.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add seen.json
          git commit -m "Update seen.json" || echo "No changes"
          git push
